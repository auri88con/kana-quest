<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kana Quest</title>
    <meta name="description" content="Kana Quest — a playful, game-style app for learning to read hiragana, katakana, kanji and Japanese verbs." />

    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Status/title bar tint. Deliberately a single media-less tag: the theme is
         a user setting, not just an OS preference, so the boot script below and
         src/hooks/useSettings.js keep its content in sync with the resolved
         theme. A media-scoped tag would win over both. -->
    <meta name="theme-color" content="#fffaf0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kana Quest" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      // Apply the saved theme before first paint, so a dark-theme user never
      // gets a flash of cream. Mirrors useSettings — keep the key in sync with
      // src/utils/settings.js.
      try {
        var saved = JSON.parse(localStorage.getItem('kana-quest-settings-v1') || '{}')
        var theme =
          saved.theme === 'light' || saved.theme === 'dark'
            ? saved.theme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        var tint = document.querySelector('meta[name="theme-color"]')
        if (tint) tint.setAttribute('content', theme === 'dark' ? '#221f33' : '#fffaf0')
        if (saved.reduceMotion) document.documentElement.dataset.reduceMotion = 'true'
      } catch (err) {
        /* first run, or storage blocked — the app applies the theme on mount */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
